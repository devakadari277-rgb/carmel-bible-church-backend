databases:
  - name: carmel-db
    databaseName: carmel_db
    user: carmel_user

services:
  - type: web
    name: carmel-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn carmel_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carmel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.10.0
